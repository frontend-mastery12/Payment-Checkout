<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Checkout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="card">

      <h2 class="pay-card">Payment Checkout</h2>

      <div class="tabs">
        <button class="tab active">Card</button>
        <button class="tab">Apple Pay</button>
        <button class="tab">Google Pay</button>
        <button class="tab">Wire</button>
      </div>

      <form class="pay-form">
        <div class="group">
          <label>Card number</label>
          <div class="input-wrap">
            <input
              type="number"
              id="card-num"
              placeholder="4242 4242 4242 4242"
              maxlength="19"
              required
            />
            <span class="badge visa">VISA</span>
          </div>
        </div>

        <div class="row">
          <div class="group">
            <label>Amount</label>
            <input
            type="number"
            id="amount"
            placeholder="$"
            maxlength="6"
            required
            />
          </div>

          <div class="group">
            <label>Expiry</label>
            <input
              type="text"
              id="exp"
              placeholder="04/28"
              maxlength="5"
              required
            />
          </div>
        </div>

        <div class="group">
          <label>Name on card</label>
          <input
            type="text"
            id="card-name"
            placeholder="John"
            required
          />
        </div>

        <div class="row">
          <div class="group">
            <label>Country</label>
            <input
              type="text"
              id="country"
              placeholder="United States"
              required
            />
          </div>
          <div class="group">
            <label>ZIP</label>
            <input
              type="text"
              id="zip"
              placeholder="94107"
              maxlength="10"
              required
            />
          </div>
        </div>

        <button type="submit" id="pay-btn" class="submit-btn">
          Pay $
        </button>

        <div class="sec-note">
          Secured by
          <strong>Quill</strong>
        </div>
      </form>
    </div>

    <script src="payment.js"></script>
  </body>
</html>
